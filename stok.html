<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Katalog Buku - Toko Buku Pustaka</title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>

        <header class="navbar">
            <div class="container navbar-content">
            <a href="dashboard.html" class="brand">
                <img src="assets/logo.png" alt="Logo Toko Buku" class="brand-logo" onerror="this.style.display='none'">
                <span>Toko Buku Pustaka</span>
            </a>
            <nav class="nav-menu">
                <a href="dashboard.html" class="nav-link">Dashboard</a>
                <a href="stok.html" class="nav-link active">Katalog Buku</a>
                <a href="checkout.html" class="nav-link">Pemesanan</a>
                <a href="tracking.html" class="nav-link">Tracking</a>
                <button type="button" class="btn btn-outline" id="btn-logout">Logout</button>
            </nav>
            </div>
        </header>

        <main class="container main-content">
            <div class="page-header">
            <h1>Informasi Stok & Katalog Buku</h1>
            <p>Kelola jumlah stok pada tabel katalog atau daftarkan buku baru ke sistem.</p>
            </div>

            <section class="stok-layout">
            <!-- Tabel Katalog Utama -->
            <div class="stok-main">
                <div class="table-container">
                <table class="data-table">
                    <thead>
                    <tr>
                        <th>Cover</th>
                        <th>Kode</th>
                        <th>Judul Buku</th>
                        <th>Kategori</th>
                        <th>Harga</th>
                        <th style="width: 90px;">Stok</th>
                        <th style="width: 170px;">Aksi</th>
                    </tr>
                    </thead>
                    <tbody id="tabel-katalog-body">
                    <!-- Data buku dirender via JavaScript DOM -->
                    </tbody>
                </table>
                </div>
            </div>

            <!-- Form Tambah Buku Baru -->
            <aside class="stok-sidebar">
                <div class="card-form">
                <h2>Tambah Buku Baru</h2>
                <form id="form-tambah-buku">
                    <div class="form-group">
                    <label for="buku-kode">Kode Buku</label>
                    <input type="text" id="buku-kode" placeholder="BK001" required>
                    </div>
                    <div class="form-group">
                    <label for="buku-judul">Judul Buku</label>
                    <input type="text" id="buku-judul" placeholder="Masukkan judul buku" required>
                    </div>
                    <div class="form-group">
                    <label for="buku-kategori">Kategori</label>
                    <select id="buku-kategori" required>
                        <option value="">Pilih Kategori</option>
                        <option value="Buku Ajar">Buku Ajar</option>
                        <option value="Fiksi">Fiksi</option>
                        <option value="Non-Fiksi">Non-Fiksi</option>
                        <option value="Teknologi">Teknologi</option>
                        <option value="Pendidikan">Pendidikan</option>
                    </select>
                    </div>
                    <div class="form-group">
                    <label for="buku-harga">Harga (Rp)</label>
                    <input type="number" id="buku-harga" min="0" placeholder="75000" required>
                    </div>
                    <div class="form-group">
                    <label for="buku-stok">Jumlah Stok Awal</label>
                    <input type="number" id="buku-stok" min="1" placeholder="10" required>
                    </div>
                    <div class="form-group">
                    <label for="buku-gambar-file">Upload Cover Buku</label>
                    <input type="file" id="buku-gambar-file" accept="image/*" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-full">Daftarkan Buku</button>
                </form>
                </div>
            </aside>
            </section>
        </main>

        <footer class="footer">
            <div class="container">
            <p>&copy; 2026 Toko Buku Pustaka. Tugas UTS Pemrograman Web 1.</p>
            </div>
        </footer>

        <script src="js/data.js"></script>
        <script src="js/script.js"></script>
    </body>
</html>
